function generar(){
  var sel=Array.prototype.slice.call(document.querySelectorAll('.ticket.selected[data-termica]'));
  if(!sel.length){msg('No hay tickets seleccionados.');return;}
  var datos=sel.map(function(el){return JSON.parse(el.getAttribute('data-termica'));});

}
